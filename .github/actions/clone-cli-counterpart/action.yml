name: Clone counterpart libviprs-cli at pinned SHA
description: >
  Clone the SECOND cross-repo counterpart (the libviprs-cli `viprs` binary) into
  ../libviprs-cli at the exact commit pinned in CLI_COUNTERPART_REV, so the
  CLI-differential harness (tests/common/cli.rs) can build `viprs` in CI. Mirrors
  the core clone-counterpart action: no branch-name guessing and no silent
  fallback to the default branch (issue #58). Requires the calling repo to be
  checked out first (actions/checkout@v4) so CLI_COUNTERPART_REV is present, AND
  the core counterpart already cloned next to it (../libviprs) since the CLI
  depends on the core crate by path.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        rev_file="${GITHUB_WORKSPACE}/CLI_COUNTERPART_REV"
        if [ ! -f "$rev_file" ]; then
          echo "::error file=CLI_COUNTERPART_REV::missing; cannot resolve the libviprs-cli pin"
          exit 1
        fi
        # Read the FIRST non-comment, non-blank line and take it verbatim — the
        # same semantics as the Rust side (cli_counterpart_pinning.rs), which
        # reads the first such line and requires exactly 40 lowercase hex. A
        # broad `grep '[0-9a-f]{40}'` would happily pick a SHA out of a comment
        # line; anchoring to the payload line keeps both sides identical. Strip
        # `#`-comments, drop blank lines, take the first remaining line, trim.
        REV="$(sed -e 's/#.*$//' "$rev_file" | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
        if ! printf '%s' "$REV" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "::error file=CLI_COUNTERPART_REV::first payload line is not a 40-char lowercase commit SHA (got '${REV}'); refusing to guess a branch"
          exit 1
        fi
        echo "Pinned libviprs-cli revision: $REV"
        dest="${GITHUB_WORKSPACE}/../libviprs-cli"
        mkdir -p "$dest"
        git -C "$dest" init -q
        git -C "$dest" remote add origin \
          "https://github.com/${{ github.repository_owner }}/libviprs-cli.git" 2>/dev/null || true
        # Fetch exactly the pinned commit (GitHub allows fetching reachable SHAs).
        git -C "$dest" fetch --depth 1 origin "$REV"
        git -C "$dest" checkout -q FETCH_HEAD
        head="$(git -C "$dest" rev-parse HEAD)"
        echo "Checked out libviprs-cli at $head"
        # Coherence assertion: the checked-out HEAD MUST equal the pin. A fetch
        # that silently resolved to a different commit (or a tampered remote)
        # fails loudly here rather than building the wrong sources.
        if [ "$head" != "$REV" ]; then
          echo "::error file=CLI_COUNTERPART_REV::checked-out HEAD $head != pinned $REV"
          exit 1
        fi
