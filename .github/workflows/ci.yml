name: CI

# Runs natively on GitHub Actions. Every branch push gets a run, so a push to a
# PR branch always produces a signal. `pull_request` on its own does not fire
# while a PR is conflicted with its base (libviprs/libviprs#585).
on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # The default `cargo test` above builds phase3_tracing WITHOUT the
      # `tracing` feature, so its per-tile span tests are cfg'd out. Exercise
      # them explicitly under the feature so the per-tile span gates CI (#83).
      - run: cargo test --features "ported_tests tracing" --test phase3_tracing
      # The object-store sink integration tests are gated behind
      # `object-store-sink`, so the default run compiles them out. Exercise the
      # feature so they actually run (#382).
      - run: cargo test --features object-store-sink --test phase3_object_store_sink --test phase3_validation_stress --test sink_object_store_stub_contract
      # Same hole, same shape, for `packfile`: both packfile test files are
      # `#![cfg(feature = "packfile")]`, the feature-cells matrix only lints
      # them, and the default run above compiles them to nothing, so no job on
      # either forge had ever executed the 14 tests in them. The first run
      # found one of them red (#191).
      - run: cargo test --features packfile --test phase3_packfile --test builder_sink_packfile

  test-pdfium:
    name: Integration Tests (pdfium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDFium
        # Provenance: pinned, checksum-verified binary from libviprs-dep — the
        # single source shared with the Dockerfile. Keep PDFIUM_RELEASE and the
        # SHA-256 digest in lockstep with the Dockerfile.
        env:
          PDFIUM_RELEASE: pdfium-8054
          PDFIUM_SHA256: b42d1731f07fb73edea38cbd294afe9be4bdcf8e4ed8523de51cd5d12fc8d271
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/libviprs/libviprs-dep/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium
          tar xzf pdfium.tgz -C pdfium --strip-components=1
          sudo cp pdfium/lib/libpdfium.so /usr/local/lib/
          sudo cp -r pdfium/include/* /usr/local/include/
          sudo ldconfig
      # Run the pdfium suite multi-threaded; the pdfium-render fork takes the
      # pdfium global mutex per call, so concurrent FPDF access is safe. The
      # wall-clock perf-ratio smoke is `#[ignore]`d and runs in nightly.yml.
      - run: cargo test --features pdfium

  ported-tests:
    name: Ported Cells (green subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - name: Fetch libvips reference suite at pinned revision
        run: ./tools/fetch_reference_suite.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tools/run_ported_cells.sh is the single source of truth for the green
      # ported_* cells. It also runs phase3_tracing under the tracing feature
      # (#83) and runs fixture_audit first, proving the pinned fetch populated
      # every fixture the suite needs. Clippy is scoped to the green targets.
      - run: ./tools/run_ported_cells.sh --clippy
      - run: ./tools/run_ported_cells.sh --require-fixtures

  feature-cells:
    name: Feature Cell (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One cell per non-default feature so a build/lint regression under a
        # feature-gated module can no longer ship green just because the default
        # harness never compiled that code. `-Dwarnings` means every gated test
        # target is fully type-checked and linted here.
        feature: [object-store-sink, packfile, tracing, jxl, avif, svg, jp2k, pdfium-static]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `pdfium-static` makes the core's `resolve_pdfium_path` dead code, and
      # the job-wide `-Dwarnings` then fails the core itself before this crate
      # is checked. That cell alone clears RUSTFLAGS; `-D warnings` after `--`
      # still applies to this crate. Drop it once the core gates the function
      # on `not(pdfium-static)` too.
      - run: cargo clippy --all-targets --features ${{ matrix.feature }} -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.feature == 'pdfium-static' && ' ' || '-Dwarnings' }}

  cli-differential:
    name: CLI Differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CLI-differential harness (tests/common/cli.rs) builds and runs the
      # `viprs` binary from the libviprs-cli sibling, so BOTH counterparts must
      # be laid down: the core crate at COUNTERPART_REV, then libviprs-cli at
      # CLI_COUNTERPART_REV.
      - uses: ./.github/actions/clone-counterpart
      - uses: ./.github/actions/clone-cli-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No libvips/libpdfium installed here: vips references are committed under
      # tests/fixtures/cli/, and pdfium binds at runtime (never loaded by the
      # morphology ops). VIPRS_REQUIRE_CLI=1 turns a would-be silent SKIP into a
      # hard panic, so this job can never go green without actually running viprs.
      - env:
          VIPRS_REQUIRE_CLI: 1
        # install_hooks_mirror_ci's cli arm is the only place the cli's
        # pre-commit hook is compared against the cli's own CI, and it can only
        # run where the sibling is laid down, which is here
        # (libviprs/libviprs#715).
        # cli_pmtiles is not a vips-differential cell and is not named
        # `cli_*_diff.rs` for that reason: PMTiles has no vips oracle, so there
        # is nothing to be differential against. It is here because this is the
        # only job that lays the CLI sibling down, and because VIPRS_REQUIRE_CLI
        # above is what stops its skip becoming a false green
        # (tests/pmtiles_ci_wiring.rs holds CI to both halves of that).
        # cli_features is here for the same reason. It builds the CLI seven
        # times, once per feature configuration it checks, into a target dir of
        # its own, so it never replaces the --no-default-features binary the
        # cells above share (libviprs/libviprs-cli#64). cli_foreign_diff is the
        # codec load/save differential (libviprs/libviprs-cli#65).
        # cli_op_map_counts holds OP_MAP.md's summary counts to its own tables
        # and to `viprs __dump-commands` (libviprs/libviprs-cli#67); without the
        # CLI sibling it skips, so it lives here too.
        run: cargo test --test install_hooks_mirror_ci --test cli_morphology_diff --test cli_bands_diff --test cli_extract_diff --test cli_conversion_diff --test cli_core_diff --test cli_convolution_diff --test cli_matrix_diff --test cli_colour_diff --test cli_resample_diff --test cli_histogram_diff --test cli_composite_diff --test cli_freqfilt_diff --test cli_mosaicing_diff --test cli_create_diff --test cli_draw_diff --test cli_aritha_diff --test cli_arithb_diff --test cli_iocleanup_diff --test cli_pmtiles --test cli_features --test cli_foreign_diff --test cli_op_map_counts
      # cli_foreign_diff's JPEG XL, JPEG 2000, AVIF and SVG cells are ignored
      # without this crate's matching features, because the decode half of each
      # comparison runs through the library. This run is the one that has them,
      # and the viprs builds it asks for are the same single-feature binaries
      # cli_features already built above (libviprs/libviprs-cli#65).
      - env:
          VIPRS_REQUIRE_CLI: 1
        run: cargo test --features "jxl jp2k avif svg" --test cli_foreign_diff
      # cli_pdf_geo_plan drives `viprs pdf`, `viprs geo` and the plan query
      # flags (libviprs/libviprs-cli#68). Its password, background and DPI cells
      # need a `viprs` built WITH the CLI's default `pdfium` feature and a
      # libpdfium, and the --no-default-features binary the cells above share
      # has neither. So this installs the same pinned, checksum-verified PDFium
      # as test-pdfium (keep PDFIUM_RELEASE and the digest in lockstep with the
      # Dockerfile), builds that binary into a target dir of its own so it never
      # replaces the shared one, and hands it over as $VIPRS_BIN.
      # VIPRS_REQUIRE_PDFIUM=1 turns the pdfium cells' SKIP into a failure, so
      # this step cannot go green by not running them.
      - name: Install PDFium for cli_pdf_geo_plan
        env:
          PDFIUM_RELEASE: pdfium-8054
          PDFIUM_SHA256: b42d1731f07fb73edea38cbd294afe9be4bdcf8e4ed8523de51cd5d12fc8d271
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/libviprs/libviprs-dep/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pdfium"
          tar xzf pdfium.tgz -C "$RUNNER_TEMP/pdfium" --strip-components=1
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Build a pdfium-enabled viprs for cli_pdf_geo_plan
        run: |
          cargo build --release --bin viprs --manifest-path ../libviprs-cli/Cargo.toml --target-dir "$RUNNER_TEMP/viprs-pdfium"
          echo "VIPRS_BIN=$RUNNER_TEMP/viprs-pdfium/release/viprs" >> "$GITHUB_ENV"
      - env:
          VIPRS_REQUIRE_CLI: 1
          VIPRS_REQUIRE_PDFIUM: 1
        run: cargo test --test cli_pdf_geo_plan

  hook-mirror:
    name: Hook Mirror (every repo in the org)
    # The hook guards compare each repo's installed pre-commit hook against
    # that repo's own ci.yml, so they need every repo laid down beside this
    # one. Nothing else in this workflow does that, and a guard whose sibling
    # is missing skips, which reads to `cargo test` as a pass. So this job
    # exists to be the one place they cannot skip: VIPRS_REQUIRE_SIBLINGS=1
    # turns a missing checkout into a panic, the same shape as
    # VIPRS_REQUIRE_CLI on the cli-differential job (tests/common/cli.rs).
    #
    # Without it the three repos that gained hooks in #198 would be guarded by
    # tests that never once ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: ./.github/actions/clone-cli-counterpart
      - name: Clone the siblings that carry no pin
        # These four are read for their workflow files only, so the default
        # branch at whatever it is now is the right thing to compare against:
        # a hook that has drifted from the CI running today is exactly what
        # this job is for. The two that do carry a pin are cloned at it above.
        run: |
          set -euo pipefail
          for repo in libviprs-bench libviprs-org libviprs-dep pdfium-render; do
            git clone --depth 1 --single-branch \
              "https://github.com/${{ github.repository_owner }}/$repo.git" \
              "${GITHUB_WORKSPACE}/../$repo"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          # install_hooks_pdfium_scope drives the fork's real hook against a
          # throwaway crate, and that hook runs cargo fmt and cargo clippy.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - env:
          VIPRS_REQUIRE_SIBLINGS: 1
          VIPRS_REQUIRE_CLI: 1
        run: cargo test --test install_hooks_mirror_ci --test install_hooks_pdfium_scope --test install_hooks_pre_push_slots --test install_hooks_localci_selection --test install_hooks_localci_worktree

  pmtiles-interop:
    name: PMTiles Interop (go-pmtiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install go-pmtiles
        # Provenance: the pinned release every fixture under
        # tests/fixtures/pmtiles/ was produced by, per that directory's
        # PROVENANCE.md. `tests/pmtiles_ci_wiring.rs` reads the release tag and
        # the digest out of the committed vector files and compares them with
        # what this block pins, so the two cannot drift apart quietly.
        #
        # Runners are x86_64, so this is the x86_64 tarball. The release carries
        # no checksums.txt, so both digests below are measurements. The inner
        # binary is verified as well as the tarball, which is one more check
        # than the pdfium block above makes: a tarball digest says the download
        # arrived intact, not that the thing inside it is the binary that wrote
        # the goldens.
        env:
          GO_PMTILES_VERSION: 1.31.2
          GO_PMTILES_TARBALL_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
          GO_PMTILES_BINARY_SHA256: a7e9ae10184d109c83f456ccdf6df4f3e2a64ba6cf69d9ed0f9f1840305055c1
        run: |
          set -euo pipefail
          curl -fsSL -o go-pmtiles.tgz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${GO_PMTILES_VERSION}/go-pmtiles_${GO_PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "${GO_PMTILES_TARBALL_SHA256}  go-pmtiles.tgz" | sha256sum -c -
          mkdir -p go-pmtiles
          tar xzf go-pmtiles.tgz -C go-pmtiles pmtiles
          echo "${GO_PMTILES_BINARY_SHA256}  go-pmtiles/pmtiles" | sha256sum -c -
          sudo install -m 0755 go-pmtiles/pmtiles /usr/local/bin/pmtiles
          pmtiles version
      # VIPRS_REQUIRE_GO_PMTILES=1 turns a would-be silent skip into a hard
      # panic, the same shape VIPRS_REQUIRE_CLI has on cli-differential. Without
      # it this job goes green on a runner where the download failed, for
      # exactly the reason a dev machine goes green: it never ran the binary.
      - env:
          VIPRS_REQUIRE_GO_PMTILES: 1
        run: cargo test --test pmtiles_interop --test phase_pmtiles --test pmtiles_bounded --test pmtiles_ci_wiring --test pmtiles_sweep

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The pre-push hook is a real file rather than a heredoc inside
      # install-hooks.sh (libviprs/libviprs#695), so it gets linted like the
      # rest of the shell. shellcheck ships on the ubuntu-latest image.
      - run: shellcheck tools/*.sh tools/hooks/pre-push
