name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # The default `cargo test` above builds phase3_tracing WITHOUT the
      # `tracing` feature, so its per-tile span tests (emits_span_per_tile,
      # tile_span_carries_coords) are cfg'd out and only the no-tracing counter
      # tests run. Exercise the span tests explicitly under the feature so the
      # per-tile `libviprs::tile` span wired in core PR #308 gates CI (issue
      # #83). This mirrors the run tools/run_ported_cells.sh performs for the
      # Docker mirror. phase3_tracing reads only the checked-in canonical PNG,
      # so it needs no reference-suite fixtures.
      - run: cargo test --features "ported_tests tracing" --test phase3_tracing
      # The object-store sink integration tests (phase3_object_store_sink, the
      # S3 leg of phase3_validation_stress, and sink_object_store_stub_contract)
      # are gated behind `object-store-sink`, so the default `cargo test` above
      # compiles them out. Exercise the feature so they actually run in CI
      # (issue #382).
      - run: cargo test --features object-store-sink --test phase3_object_store_sink --test phase3_validation_stress --test sink_object_store_stub_contract

  test-pdfium:
    name: Integration Tests (pdfium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDFium
        # Provenance: pinned, checksum-verified binary from libviprs-dep — the
        # single source shared with the Dockerfile. Keep PDFIUM_RELEASE and the
        # SHA-256 digest in lockstep with the Dockerfile.
        env:
          PDFIUM_RELEASE: pdfium-7881
          PDFIUM_SHA256: 653f24f074afe6c868f634ae0cc954a1a89821f33bc7795f16065a14022b662b
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/libviprs/libviprs-dep/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium
          tar xzf pdfium.tgz -C pdfium --strip-components=1
          sudo cp pdfium/lib/libpdfium.so /usr/local/lib/
          sudo cp -r pdfium/include/* /usr/local/include/
          sudo ldconfig
      # Run the pdfium suite multi-threaded. The pdfium-render fork on the
      # `libviprs/integration` branch takes the pdfium global mutex per call in
      # `ThreadSafePdfiumBindings`, so concurrent FPDF access across cargo-test
      # worker threads is safe. Dropping `--test-threads=1` makes the suite
      # itself exercise that cross-test concurrency. The wall-clock perf-ratio
      # smoke is `#[ignore]`d and runs in nightly.yml, so it never gates this
      # job on shared runner timing noise.
      - run: cargo test --features pdfium

  ported-tests:
    name: Ported Cells (green subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - name: Fetch libvips reference suite at pinned revision
        run: ./tools/fetch_reference_suite.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tools/run_ported_cells.sh is the single source of truth for the green
      # ported_* cells (twelve cells, 224 tests; ported_infrastructure runs
      # with --test-threads=1 per its header). It also runs phase3_tracing
      # under the tracing feature so the per-tile span tests gate here too
      # (issue #83). The test pass runs fixture_audit first, proving the pinned
      # fetch populated every fixture the suite needs. Clippy is scoped to the
      # green targets because the two deferred codec cells (ported_foreign,
      # ported_connection) do not compile yet; issue #77 tracks that remainder.
      - run: ./tools/run_ported_cells.sh --clippy
      - run: ./tools/run_ported_cells.sh --require-fixtures

  feature-cells:
    name: Feature Cell (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One cell per non-default feature so a build/lint regression under a
        # feature-gated module (the `object-store-sink` object-store sink, the
        # `packfile` archive sink, the `tracing` span instrumentation) can no
        # longer ship green just because the default harness never compiled that
        # code. `-Dwarnings` (via RUSTFLAGS) means every gated test target is
        # fully type-checked and linted here, not merely conditionally excluded.
        # `pdfium` has its own job above; `ported_tests` has the ported-tests
        # job above (it cannot join this `--all-targets` matrix because the
        # two deferred codec cells do not compile yet, so its clippy pass is
        # scoped to the green cells via tools/run_ported_cells.sh; issue #77).
        feature: [object-store-sink, packfile, tracing]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features ${{ matrix.feature }} -- -D warnings

  cli-differential:
    name: CLI Differential (morphology, bands, extract, conversion, core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CLI-differential harness (tests/common/cli.rs) builds and runs the
      # `viprs` binary from the libviprs-cli sibling, so BOTH counterparts must
      # be laid down: the core crate (libviprs-cli depends on it by path) at
      # COUNTERPART_REV, then libviprs-cli itself at CLI_COUNTERPART_REV.
      - uses: ./.github/actions/clone-counterpart
      - uses: ./.github/actions/clone-cli-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No libvips is installed here: the vips references are committed under
      # tests/fixtures/cli/ (regenerated offline by tools/gen_cli_expected.sh).
      # No libpdfium.so is installed either, yet the harness builds the CLI with
      # pdfium compiled in: libviprs-cli depends on the core crate with
      # `features=["pdfium"]` (non-optional), so `--no-default-features` (which
      # disables only the CLI crate's OWN default features) does NOT drop pdfium.
      # The build still links because `pdfium-render` binds libpdfium at RUNTIME,
      # not build/link time, and the morphology ops never touch a PDF path so
      # libpdfium is never loaded. VIPRS_REQUIRE_CLI=1 turns a would-be silent
      # SKIP (which reads to cargo as a pass) into a hard panic, so this job can
      # never go green while failing to actually run viprs (CLI_CONTRACT.md §7).
      - env:
          VIPRS_REQUIRE_CLI: 1
        run: cargo test --test cli_morphology_diff --test cli_bands_diff --test cli_extract_diff --test cli_conversion_diff --test cli_core_diff --test cli_resample_diff

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
