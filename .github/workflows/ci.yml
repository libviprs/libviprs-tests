name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test-pdfium:
    name: Integration Tests (pdfium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDFium
        # Provenance: pinned, checksum-verified binary from libviprs-dep — the
        # single source shared with the Dockerfile. Keep PDFIUM_RELEASE and the
        # SHA-256 digest in lockstep with the Dockerfile.
        env:
          PDFIUM_RELEASE: pdfium-7881
          PDFIUM_SHA256: 653f24f074afe6c868f634ae0cc954a1a89821f33bc7795f16065a14022b662b
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/libviprs/libviprs-dep/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium
          tar xzf pdfium.tgz -C pdfium --strip-components=1
          sudo cp pdfium/lib/libpdfium.so /usr/local/lib/
          sudo cp -r pdfium/include/* /usr/local/include/
          sudo ldconfig
      # Run the pdfium suite multi-threaded. The pdfium-render fork on the
      # `libviprs/integration` branch takes the pdfium global mutex per call in
      # `ThreadSafePdfiumBindings`, so concurrent FPDF access across cargo-test
      # worker threads is safe. Dropping `--test-threads=1` makes the suite
      # itself exercise that cross-test concurrency. The wall-clock perf-ratio
      # smoke is `#[ignore]`d and runs in nightly.yml, so it never gates this
      # job on shared runner timing noise.
      - run: cargo test --features pdfium

  reference-fixtures:
    name: Reference Fixtures (pinned fetch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - name: Fetch libvips reference suite at pinned revision
        run: ./tools/fetch_reference_suite.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prove the pinned fetch populated every fixture the ported suite needs.
      - run: cargo test --features ported_tests --test fixture_audit

  feature-cells:
    name: Feature Cell (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One cell per non-default feature so a build/lint regression under a
        # feature-gated module (the `s3` object-store sink, the `packfile`
        # archive sink, the `tracing` span instrumentation) can no longer ship
        # green just because the default harness never compiled that code.
        # `-Dwarnings` (via RUSTFLAGS) means every gated test target is fully
        # type-checked and linted here, not merely conditionally excluded.
        # `pdfium` has its own job above; `ported_tests` is exercised by the
        # reference-fixtures job (its full suite targets a libviprs op API that
        # is not yet on the crate).
        feature: [s3, packfile, tracing]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features ${{ matrix.feature }} -- -D warnings

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
