[package]
name = "libviprs-tests"
version = "0.3.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.85"
publish = false

[features]
# `test-util` is on by default: this crate *is* the external stress suite the
# core `test-util` feature exists to serve, so `libviprs::sink::SlowSink` must
# be reachable in a plain `cargo test` run. See
# `tests/public_api_no_test_doubles.rs` (libviprs#299).
default = ["test-util"]
pdfium = ["libviprs/pdfium", "dep:pdfium-render"]
ported_tests = []
# Activates the core crate's `test-util` feature so its test-only sink doubles
# (`SlowSink`) are exposed to this suite. See libviprs#299.
test-util = ["libviprs/test-util"]
# Enables the Phase 3 object-store sink integration tests
# (`tests/sink_object_store_stub_contract.rs` and the S3 leg of
# `tests/phase3_validation_stress.rs`). Activates the `object-store-sink`
# feature on the core `libviprs` crate so that `libviprs::sink::ObjectStoreSink`
# and `libviprs::sink::ObjectStoreConfig` are exposed.
object-store-sink = ["libviprs/object-store-sink"]
# Deprecated alias for `object-store-sink`, retained so consumers that pinned the
# old `s3` feature name keep building. Prefer `object-store-sink`.
s3 = ["object-store-sink"]
# Enables Phase 3 packfile archive-sink integration tests in
# `tests/phase3_packfile.rs`. Activates the `packfile` feature on the
# core `libviprs` crate so that `libviprs::sink::PackfileSink` and
# `libviprs::sink::PackfileFormat` are exposed. The `tar` and `zip`
# dev-dependencies are listed unconditionally under
# `[dev-dependencies]` (Cargo does not support `optional = true` on
# dev-deps), but they are only *linked* from code guarded by
# `#[cfg(feature = "packfile")]`.
packfile = ["libviprs/packfile"]
# Enables Phase 3 tracing-span integration tests in
# `tests/phase3_tracing.rs`. Activates the `tracing` feature on the
# core `libviprs` crate so that `generate_pyramid` emits pipeline /
# level / tile / encode / sink_write spans which the tests capture
# via `tracing-subscriber`. The `tracing` and `tracing-subscriber`
# crates are listed unconditionally under `[dev-dependencies]` (Cargo
# does not support `optional = true` on dev-deps), but they are only
# *linked* from code guarded by `#[cfg(feature = "tracing")]`.
tracing = ["libviprs/tracing"]
# Activates the core crate's non-default `jxl` feature so `test_jxlsave` in
# `tests/ported_foreign.rs` exercises the real JPEG XL round trip rather than
# the typed refusal the default build reports (libviprs#500). The cell asserts
# under both, so the feature is what decides which contract is pinned, not
# whether anything is pinned at all. `tools/run_ported_cells.sh` runs it both
# ways, the same shape `test_dz_zip` uses for `packfile`.
jxl = ["libviprs/jxl"]

[dependencies]
libviprs = { path = "../libviprs" }
pdfium-render = { version = "0.9", optional = true }
# Feature unification across the workspace means the decode features enabled
# here also reach the core `libviprs` crate's `image` dependency, so the ported
# foreign cell's `decode_file`/`decode_bytes` calls gain the pure-Rust decoders
# for these formats (bmp/gif/pnm/tga/ico/webp/hdr). See tools/run_ported_cells.sh
# and issue #77. Encode-only external formats (heif/avif/jp2k) stay deferred;
# JPEG XL has a real decoder and a real lossless encoder as of libviprs#500,
# behind the `jxl` feature above.
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "tiff", "bmp", "gif", "pnm", "tga", "ico", "webp", "hdr",
] }
flate2 = "1"
tempfile = "3"
# Used by `tests/gen_canonicals.rs` (the offline canonical-fixture
# generator) and by tests that introspect PDF object graphs. No test
# mutates a PDF at runtime: rotation coverage now loads the checked-in
# `canonical_rotated_{90,180,270}.pdf` fixtures instead. Keep the
# version in lockstep with the libviprs core dep at libviprs/Cargo.toml.
lopdf = "0.36"

[dev-dependencies]
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Used by `tests/phase3_checksum.rs` to verify checksum hex digests
# independently of the core crate's implementation.
blake3 = "1"
sha2 = "0.10"
# Used by `tests/builder_composition_invariants.rs` for property-based
# invariants over the `EngineBuilder` composition surface.
proptest = "1"
# Mirror the core crate's `pdfium-render` thread-safety fork. `[patch]`
# tables apply only from the build-root manifest, so the pin in
# `../libviprs/Cargo.toml` does not reach this crate when it is the
# build root — without this override this crate would resolve the
# unpatched `pdfium-render 0.9.x` from crates.io, whose
# `ThreadSafePdfiumBindings` acquires the pdfium global mutex only once
# on `FPDF_InitLibrary` and bypasses it for every other call,
# segfaulting under concurrent access to a shared `Pdfium`.
#
# HONESTY / pin strength: this override pins the MUTABLE
# `libviprs/integration` branch, NOT the immutable commit `rev` the core
# crate (`../libviprs/Cargo.toml`) pins. A force-push or rebase of that
# branch silently changes what this patch resolves on the next fetch, so
# this override is not reproducible the way the core `rev` pin is — it
# only tracks the branch head. Do not read "mirror" / "lockstep" above as
# a claim of matching immutability: today the two differ, and converting
# this patch to the same immutable `rev` (genuine lockstep) is deferred as
# a follow-up under the fork-pinning epic #344. Until then, keep this
# branch pointed at the fork the core `rev` was cut from, and drop both
# once the fork is upstreamed and released.
[patch.crates-io]
pdfium-render = { git = "https://github.com/libviprs/pdfium-render.git", branch = "libviprs/integration" }
