name: Nightly

# Wall-clock perf smokes are too timing-sensitive to gate every PR on the
# shared runner, so they are `#[ignore]`d out of ci.yml and exercised here on a
# schedule. A transient blip on a nightly is a retryable run, not a merge
# blocker. Runs on the self-hosted Gitea Actions runner and reports the result
# to GitHub as the `gitea/nightly` commit status.
on:
  schedule:
    # 07:00 UTC daily.
    - cron: "0 7 * * *"
  # Allow an on-demand run from the Actions tab.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Post an early `pending` gitea/nightly status so GitHub shows the run in-flight.
  status:
    name: Report pending
    runs-on: ubuntu-latest
    steps:
      - name: Post pending gitea/nightly status to GitHub
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"gitea/nightly\",\"description\":\"Gitea nightly running\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions\"}" || true

  perf-smoke:
    name: Perf smoke (pdfium, ignored tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clone-counterpart
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDFium
        # Provenance: pinned, checksum-verified binary from libviprs-dep — the
        # single source shared with the Dockerfile and ci.yml. Keep
        # PDFIUM_RELEASE and the SHA-256 digest in lockstep with those files.
        env:
          PDFIUM_RELEASE: pdfium-7881
          PDFIUM_SHA256: 653f24f074afe6c868f634ae0cc954a1a89821f33bc7795f16065a14022b662b
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/libviprs/libviprs-dep/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium
          tar xzf pdfium.tgz -C pdfium --strip-components=1
          sudo cp pdfium/lib/libpdfium.so /usr/local/lib/
          sudo cp -r pdfium/include/* /usr/local/include/
          sudo ldconfig
      # Run only the `#[ignore]`d tests (the wall-clock perf-ratio smokes).
      # These assert streaming <= 12x cached and are the signal moved off the
      # per-PR path in issue #59.
      - run: cargo test --features pdfium -- --ignored

  # Aggregate the outcome into the final gitea/nightly status.
  report:
    name: Report gitea/nightly result
    runs-on: ubuntu-latest
    needs: [perf-smoke]
    if: always()
    steps:
      - name: Post final gitea/nightly status to GitHub
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          RESULTS: "${{ needs.perf-smoke.result }}"
        run: |
          if echo "$RESULTS" | grep -qwE 'failure|cancelled'; then
            STATE=failure
          else
            STATE=success
          fi
          echo "job results: $RESULTS -> gitea/nightly=$STATE"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"gitea/nightly\",\"description\":\"Gitea nightly $STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions\"}" || true
